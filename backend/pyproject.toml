[project]
name = "rumi-backend-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "google-genai",
    "python-dotenv",
    "pydantic",
    "firebase-admin",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"